<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Zombie Survival VR — Исправление ошибок</title>
    
    <!-- 1. Загружаем основной A-Frame -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

    <!-- 2. Скрипт-мост для исправления совместимости THREE.js -->
    <script>
      (function() {
        // Проверяем наличие THREE и MathUtils (стандарт для A-Frame 1.4.2)
        if (window.THREE && window.THREE.MathUtils) {
          window.THREE.Math = window.THREE.Math || {};
          // Копируем нужные функции туда, где их ищет aframe-extras
          window.THREE.Math.degToRad = window.THREE.MathUtils.degToRad;
          window.THREE.Math.radToDeg = window.THREE.MathUtils.radToDeg;
          console.log("Совместимость MathUtils исправлена успешно.");
        }
      })();
    </script>

    <!-- 3. Загружаем дополнительные библиотеки после исправления -->
    <script src="https://unpkg.com/aframe-environment-component@1.3.2/dist/aframe-environment-component.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
    
    <script>
      // Система захвата предметов (кнопка Grip)
      AFRAME.registerComponent('grab-system', {
        init: function () {
          this.grabbing = false;
          this.grabbedEl = null;

          this.el.addEventListener('gripdown', () => {
            const collectibles = document.querySelectorAll('.grabbable');
            let closest = null;
            let minDist = 0.5;

            collectibles.forEach(el => {
              const dist = el.object3D.position.distanceTo(this.el.object3D.position);
              if (dist < minDist) {
                minDist = dist;
                closest = el;
              }
            });

            if (closest && !this.grabbing) {
              this.grabbedEl = closest;
              this.grabbedEl.setAttribute('position', '0 0 0');
              this.el.appendChild(this.grabbedEl);
              this.grabbing = true;
            }
          });

          this.el.addEventListener('gripup', () => {
            if (this.grabbing && this.grabbedEl) {
              const scene = document.querySelector('a-scene');
              const worldPos = new THREE.Vector3();
              this.grabbedEl.object3D.getWorldPosition(worldPos);
              
              scene.appendChild(this.grabbedEl);
              this.grabbedEl.setAttribute('position', worldPos);
              this.grabbedEl = null;
              this.grabbing = false;
            }
          });
        }
      });

      // Логика противников
      AFRAME.registerComponent('zombie-ai', {
        schema: { speed: {type: 'number', default: 0.01} },
        init: function () {
          this.player = document.querySelector('#camera');
          this.isDead = false;
          this.el.classList.add('target');
        },
        tick: function () {
          if (this.isDead || !this.player) return;
          
          let playerPos = new THREE.Vector3();
          this.player.object3D.getWorldPosition(playerPos);
          let currentPos = this.el.object3D.position;
          
          let angle = Math.atan2(playerPos.x - currentPos.x, playerPos.z - currentPos.z);
          this.el.object3D.rotation.y = angle;
          this.el.object3D.translateZ(this.data.speed);
        },
        die: function() {
          if (this.isDead) return;
          this.isDead = true;
          this.el.setAttribute('animation', {
            property: 'rotation',
            to: '90 0 0',
            dur: 500,
            easing: 'easeInQuad'
          });
          setTimeout(() => {
            if (this.el.parentNode) this.el.parentNode.removeChild(this.el);
          }, 3000);
        }
      });

      // Логика стрельбы (кнопка Trigger)
      AFRAME.registerComponent('shooter', {
        init: function () {
          this.el.addEventListener('triggerdown', () => {
            const raycaster = new THREE.Raycaster();
            const pos = new THREE.Vector3();
            this.el.object3D.getWorldPosition(pos);
            const dir = new THREE.Vector3(0, 0, -1);
            dir.applyQuaternion(this.el.object3D.getWorldQuaternion(new THREE.Quaternion()));
            
            raycaster.set(pos, dir);
            const targets = document.querySelectorAll('.target');
            const hits = raycaster.intersectObjects(Array.from(targets).map(t => t.object3D), true);
            
            if (hits.length > 0) {
              let hitEntity = hits[0].object;
              while (hitEntity && !hitEntity.el.hasAttribute('zombie-ai')) {
                hitEntity = hitEntity.parent;
              }
              if (hitEntity) hitEntity.el.components['zombie-ai'].die();
            }
            this.flash();
          });
        },
        flash: function() {
          const l = document.createElement('a-light');
          l.setAttribute('type', 'point');
          l.setAttribute('intensity', '2');
          l.setAttribute('color', 'yellow');
          this.el.appendChild(l);
          setTimeout(() => l.parentNode && this.el.removeChild(l), 50);
        }
      });
    </script>
  </head>
  <body>
    <a-scene>
      <a-entity environment="preset: forest; lighting: point; dressingAmount: 400"></a-entity>

      <!-- Игрок -->
      <a-entity id="rig" movement-controls="speed: 0.15">
        <a-entity id="camera" camera position="0 1.6 0" look-controls></a-entity>
        
        <a-entity id="leftHand" oculus-touch-controls="hand: left" grab-system>
          <a-sphere radius="0.04" color="#ffccaa" opacity="0.8"></a-sphere>
        </a-entity>
        
        <a-entity id="rightHand" oculus-touch-controls="hand: right" grab-system shooter>
          <a-sphere radius="0.04" color="#ffccaa" opacity="0.8"></a-sphere>
        </a-entity>
      </a-entity>

      <!-- Стойка с оружием -->
      <a-entity position="0 0 -2">
        <a-box position="0 0.5 0" width="1" height="1" depth="0.5" color="#333"></a-box>
        
        <a-entity class="grabbable" position="0 1.1 0">
          <a-box width="0.05" height="0.1" depth="0.25" color="#111"></a-box>
          <a-box position="0 -0.06 0.08" width="0.04" height="0.12" depth="0.04" color="#000"></a-box>
        </a-entity>

        <a-text value="GRIP: TAKE | TRIGGER: SHOOT" position="0 1.5 0.3" align="center" width="3"></a-text>
      </a-entity>

      <!-- Зомби -->
      <a-entity zombie-ai="speed: 0.01" position="10 0 -15">
        <a-capsule radius="0.3" height="1.8" color="#445533"></a-capsule>
      </a-entity>

      <a-entity zombie-ai="speed: 0.015" position="-10 0 -20">
        <a-capsule radius="0.3" height="1.8" color="#334422"></a-capsule>
      </a-entity>

      <a-light type="ambient" intensity="0.5"></a-light>
      <a-light type="directional" position="1 4 2" intensity="0.7"></a-light>
    </a-scene>
  </body>
</html>
