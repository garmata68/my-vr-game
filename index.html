<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Охотник на Фантомов VR</title>
    <!-- Только чистый и стабильный A-Frame, никаких ломающихся плагинов -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

    <script>
      // ==========================================
      // 1. ГЕНЕРАТОР ЗАБРОШЕННОГО ГОРОДА
      // ==========================================
      AFRAME.registerComponent('ruins-generator', {
        init: function () {
          const colors = ['#1a1a1a', '#222222', '#2a2a2a', '#111111'];
          // Создаем 60 заброшенных зданий и руин вокруг игрока
          for (let i = 0; i < 60; i++) {
            let x = (Math.random() - 0.5) * 100;
            let z = (Math.random() - 0.5) * 100;
            
            // Оставляем центр (зону появления) свободной
            if (Math.abs(x) < 8 && Math.abs(z) < 8) continue;

            let building = document.createElement('a-entity');
            building.setAttribute('position', {x: x, y: 0, z: z});

            let height = Math.random() * 8 + 3;
            let width = Math.random() * 6 + 3;
            let depth = Math.random() * 6 + 3;

            // Основной блок здания
            let block = document.createElement('a-box');
            block.setAttribute('width', width);
            block.setAttribute('height', height);
            block.setAttribute('depth', depth);
            block.setAttribute('position', {x: 0, y: height/2, z: 0});
            block.setAttribute('color', colors[Math.floor(Math.random() * colors.length)]);
            block.setAttribute('roughness', '1');
            building.appendChild(block);

            this.el.appendChild(building);
          }
        }
      });

      // ==========================================
      // 2. ИДЕАЛЬНОЕ ПЕРЕДВИЖЕНИЕ (БЕЗ ОШИБОК И ТОШНОТЫ)
      // ==========================================
      AFRAME.registerComponent('smooth-locomotion', {
        init: function () {
          this.rig = document.querySelector('#rig');
          this.camera = document.querySelector('#camera');
          this.x = 0; this.y = 0;
          this.el.addEventListener('axismove', (evt) => {
            this.x = evt.detail.axis[0];
            this.y = evt.detail.axis[1];
          });
        },
        tick: function () {
          if (Math.abs(this.x) < 0.1 && Math.abs(this.y) < 0.1) return; // Мертвая зона стика
          
          let direction = new THREE.Vector3(this.x, 0, this.y);
          let rotation = this.camera.getAttribute('rotation');
          
          // Движение туда, куда повернута голова
          direction.applyAxisAngle(new THREE.Vector3(0, 1, 0), THREE.MathUtils.degToRad(rotation.y));
          
          let pos = this.rig.getAttribute('position');
          pos.x += direction.x * 0.08;
          pos.z += direction.z * 0.08;
          this.rig.setAttribute('position', pos);
        }
      });

      // Резкий поворот правым стиком (защита от укачивания)
      AFRAME.registerComponent('snap-turn', {
        init: function () {
          this.rig = document.querySelector('#rig');
          this.canTurn = true;
          this.el.addEventListener('axismove', (evt) => {
            let x = evt.detail.axis[0];
            if (Math.abs(x) > 0.8 && this.canTurn) {
              let rot = this.rig.getAttribute('rotation');
              rot.y -= Math.sign(x) * 45; // Поворот ровно на 45 градусов
              this.rig.setAttribute('rotation', rot);
              this.canTurn = false;
              setTimeout(() => this.canTurn = true, 400); // Задержка перед следующим поворотом
            }
          });
        }
      });

      // ==========================================
      // 3. БОЕВАЯ СИСТЕМА И ВРАГИ
      // ==========================================
      AFRAME.registerComponent('phantom-ai', {
        schema: { speed: {type: 'number', default: 0.03} },
        init: function () {
          this.player = document.querySelector('#camera');
          this.isDead = false;
          this.el.classList.add('target');
          this.time = Math.random() * 100;
        },
        tick: function () {
          if (this.isDead || !this.player) return;
          
          this.time += 0.05;
          let playerPos = new THREE.Vector3();
          this.player.object3D.getWorldPosition(playerPos);
          let currentPos = this.el.object3D.position;
          
          // Поворот к игроку
          let angle = Math.atan2(playerPos.x - currentPos.x, playerPos.z - currentPos.z);
          this.el.object3D.rotation.y = angle;
          
          // Медленное жуткое движение + парение в воздухе
          this.el.object3D.translateZ(this.data.speed);
          this.el.object3D.position.y = 1.5 + Math.sin(this.time) * 0.3;
        },
        die: function() {
          if (this.isDead) return;
          this.isDead = true;
          
          // Красивая анимация исчезновения
          this.el.setAttribute('animation__scale', {property: 'scale', to: '0 0 0', dur: 400, easing: 'easeInBack'});
          setTimeout(() => {
            if (this.el.parentNode) this.el.parentNode.removeChild(this.el);
            // Спавним нового фантома, чтобы игра не кончалась
            document.querySelector('a-scene').components['game-manager'].spawnPhantom();
          }, 450);
        }
      });

      AFRAME.registerComponent('blaster', {
        init: function () {
          this.el.addEventListener('triggerdown', () => this.shoot());
        },
        shoot: function () {
          // Мощная ВИБРАЦИЯ контроллера
          const gamepad = this.el.components['tracked-controls']?.controller;
          if (gamepad && gamepad.hapticActuators && gamepad.hapticActuators.length > 0) {
            gamepad.hapticActuators[0].pulse(1.0, 100); // Максимальная сила, 100 миллисекунд
          }

          // Луч лазера
          const scene = document.querySelector('a-scene');
          const laser = document.createElement('a-entity');
          laser.setAttribute('geometry', { primitive: 'cylinder', radius: 0.01, height: 50 });
          laser.setAttribute('material', { color: '#00FFFF', emissive: '#00FFFF', shader: 'flat' });
          
          const pos = new THREE.Vector3();
          this.el.object3D.getWorldPosition(pos);
          const quat = new THREE.Quaternion();
          this.el.object3D.getWorldQuaternion(quat);
          
          laser.object3D.position.copy(pos);
          laser.object3D.quaternion.copy(quat);
          laser.object3D.rotateX(THREE.MathUtils.degToRad(90));
          laser.object3D.translateY(25); // Смещаем луч вперед
          
          scene.appendChild(laser);
          setTimeout(() => scene.removeChild(laser), 60);

          // Проверка попадания
          const raycaster = new THREE.Raycaster();
          const dir = new THREE.Vector3(0, 0, -1);
          dir.applyQuaternion(quat);
          raycaster.set(pos, dir);
          
          const targets = document.querySelectorAll('.target');
          const hits = raycaster.intersectObjects(Array.from(targets).map(t => t.object3D), true);
          
          if (hits.length > 0) {
            let hitEntity = hits[0].object;
            while (hitEntity && !hitEntity.el.hasAttribute('phantom-ai')) hitEntity = hitEntity.parent;
            if (hitEntity) hitEntity.el.components['phantom-ai'].die();
          }
        }
      });

      // Спавнер врагов
      AFRAME.registerComponent('game-manager', {
        init: function () {
          for(let i=0; i<10; i++) this.spawnPhantom();
        },
        spawnPhantom: function() {
          const scene = document.querySelector('a-scene');
          const phantom = document.createElement('a-entity');
          
          let angle = Math.random() * Math.PI * 2;
          let radius = 15 + Math.random() * 10;
          let x = Math.cos(angle) * radius;
          let z = Math.sin(angle) * radius;

          phantom.setAttribute('position', {x: x, y: 1.5, z: z});
          phantom.setAttribute('phantom-ai', '');
          
          // Внешний вид "Теневого Фантома" (мрачно и круто)
          phantom.innerHTML = `
            <a-sphere radius="0.4" color="#000" opacity="0.8" roughness="1"></a-sphere>
            <a-sphere position="0.15 0.1 0.3" radius="0.08" color="#FF0000" emissive="#FF0000" shader="flat"></a-sphere>
            <a-sphere position="-0.15 0.1 0.3" radius="0.08" color="#FF0000" emissive="#FF0000" shader="flat"></a-sphere>
          `;
          scene.appendChild(phantom);
        }
      });
    </script>
  </head>
  <body>
    <!-- Мрачная атмосфера с густым туманом -->
    <a-scene fog="type: exponential; color: #0a0a0c; density: 0.08" game-manager>
      
      <!-- Генератор Заброшек -->
      <a-entity ruins-generator></a-entity>

      <!-- Земля -->
      <a-plane rotation="-90 0 0" width="200" height="200" color="#111" roughness="1"></a-plane>

      <!-- Игрок и Управление -->
      <a-entity id="rig" position="0 0 0">
        <a-entity id="camera" camera position="0 1.6 0" look-controls="pointerLockEnabled: false"></a-entity>
        
        <!-- Левая рука: Плавная ходьба -->
        <a-entity id="leftHand" oculus-touch-controls="hand: left" smooth-locomotion>
          <!-- Модель перчатки -->
          <a-box width="0.1" height="0.1" depth="0.1" color="#333"></a-box>
        </a-entity>
        
        <!-- Правая рука: Повороты и встроенный Бластер -->
        <a-entity id="rightHand" oculus-touch-controls="hand: right" snap-turn blaster>
          <!-- Модель кибер-бластера -->
          <a-entity position="0 0 -0.05">
            <a-box width="0.06" height="0.08" depth="0.2" color="#222"></a-box>
            <a-cylinder position="0 0.02 -0.1" radius="0.015" height="0.15" rotation="90 0 0" color="#00FFFF" emissive="#00FFFF"></a-cylinder>
          </a-entity>
        </a-entity>
      </a-entity>

      <!-- Освещение -->
      <a-light type="ambient" color="#222"></a-light>
      <a-light type="directional" position="-1 2 1" color="#445566" intensity="0.5"></a-light>

    </a-scene>
  </body>
</html>
