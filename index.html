<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Sandbox VR</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="instructions">
        <h1>SANDBOX VR</h1>
        <p>Нажми, чтобы начать</p>
        <p><span class="kbd">WASD</span> — Ходьба | <span class="kbd">E</span> — Взять | <span class="kbd">Q</span> — Меню | <span class="kbd">R</span> — Удалить</p>
    </div>

    <div id="sandbox-menu">
        <h3>Спавн объектов</h3>
        <div class="menu-item" id="spawn-box">Куб</div>
        <div class="menu-item" id="spawn-sphere">Шар</div>
        <div class="menu-item" id="spawn-cyl">Колонна</div>
        <p style="font-size: 10px; color: #ccc;">Нажми Q чтобы закрыть</p>
    </div>

    <div id="hud">Наведи на предмет</div>
    <div id="crosshair"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module" src="main.js"></script>
</body>
</html>
