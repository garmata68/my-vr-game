<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNRECORDED VR</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', Courier, monospace; }
        #menu {
            position: absolute;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            text-align: center; color: white; z-index: 100;
        }
        .btn {
            background: transparent; color: white; border: 1px solid white;
            padding: 20px 40px; cursor: pointer; letter-spacing: 5px;
        }
    </style>
</head>
<body>

<div id="menu">
    <h1>UNRECORDED VR</h1>
    <div style="margin-bottom: 20px; color: #888;">ПОДКЛЮЧИТЕ ШЛЕМ</div>
    <div id="vr-button-container"></div>
</div>

<script type="module">
    // Импортируем VRButton для WebXR
    import { VRButton } from 'https://unpkg.com/three@0.128.0/examples/jsm/webxr/VRButton.js';

    let scene, camera, renderer, clock;
    let controller1, controller2;
    let weaponGroup, flashlight;
    let walls = [], targets = [], particles = [];

    function init() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x010101);
        scene.fog = new THREE.FogExp2(0x010101, 0.05);

        camera = new THREE.PerspectiveCamera(80, window.innerWidth / window.innerHeight, 0.1, 100);
        
        // Рендерер с поддержкой XR
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.xr.enabled = true; // ВКЛЮЧАЕМ VR
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // Кнопка входа в VR
        document.getElementById('vr-button-container').appendChild(VRButton.createButton(renderer));

        const ambient = new THREE.AmbientLight(0xffffff, 0.02);
        scene.add(ambient);

        clock = new THREE.Clock();

        // Настройка контроллеров
        controller1 = renderer.xr.getController(0);
        controller1.addEventListener('selectstart', shoot); // Стрельба на курок
        scene.add(controller1);

        buildLevel();
        setupWeapon();

        renderer.setAnimationLoop(render);
    }

    function setupWeapon() {
        // Оружие теперь привязано к контроллеру, а не к камере
        weaponGroup = new THREE.Group();
        const mat = new THREE.MeshStandardMaterial({ color: 0x111, metalness: 0.8 });
        const slide = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.06, 0.2), mat);
        
        flashlight = new THREE.SpotLight(0xfff5e6, 5, 20, Math.PI/6);
        flashlight.castShadow = true;
        
        weaponGroup.add(slide, flashlight);
        flashlight.position.set(0, 0, 0);
        flashlight.target.position.set(0, 0, -1);
        weaponGroup.add(flashlight.target);

        controller1.add(weaponGroup);
    }

    // Твоя функция генерации текстур (без изменений)
    function createNoiseTexture(color1, color2, scale) {
        const canvas = document.createElement('canvas');
        canvas.width = 512; canvas.height = 512;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = color1;
        ctx.fillRect(0, 0, 512, 512);
        for(let i=0; i<5000; i++) {
            ctx.fillStyle = Math.random() > 0.5 ? color2 : color1;
            ctx.fillRect(Math.random()*512, Math.random()*512, scale, scale);
        }
        return new THREE.CanvasTexture(canvas);
    }

    function buildLevel() {
        const floorTex = createNoiseTexture('#1a1a1a', '#222', 2);
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(50, 50), new THREE.MeshStandardMaterial({map: floorTex}));
        floor.rotation.x = -Math.PI/2;
        floor.receiveShadow = true;
        scene.add(floor);

        const wallMat = new THREE.MeshStandardMaterial({ map: createNoiseTexture('#2a2a2a', '#111', 4) });
        
        // Упрощенная расстановка стен для VR
        for(let i=0; i<10; i++) {
            const wall = new THREE.Mesh(new THREE.BoxGeometry(4, 4, 1), wallMat);
            wall.position.set(Math.random()*20-10, 2, Math.random()*20-10);
            scene.add(wall);
            walls.push(new THREE.Box3().setFromObject(wall));
        }
    }

    function shoot() {
        // Raycast идет от контроллера (куда направлена рука)
        const tempMatrix = new THREE.Matrix4();
        tempMatrix.extractRotation(controller1.matrixWorld);
        
        const raycaster = new THREE.Raycaster();
        raycaster.ray.origin.setFromMatrixPosition(controller1.matrixWorld);
        raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);

        // Вспышка
        const flash = new THREE.PointLight(0xffaa00, 10, 2);
        flash.position.copy(weaponGroup.position);
        controller1.add(flash);
        setTimeout(() => controller1.remove(flash), 40);

        const hits = raycaster.intersectObjects(scene.children, true);
        if(hits.length > 0 && hits[0].object.type === 'Mesh') {
            createImpact(hits[0].point, hits[0].face.normal);
        }
    }

    function createImpact(pos, normal) {
        const pCount = 15;
        const geo = new THREE.SphereGeometry(0.02, 4, 4);
        const mat = new THREE.MeshBasicMaterial({ color: 0xffaa00 });
        for(let i=0; i<pCount; i++) {
            const p = new THREE.Mesh(geo, mat);
            p.position.copy(pos);
            scene.add(p);
            particles.push({ 
                mesh: p, 
                vel: new THREE.Vector3(normal.x + Math.random()-0.5, 1, normal.z + Math.random()-0.5).multiplyScalar(0.05),
                life: 1.0 
            });
        }
    }

    function render() {
        const delta = clock.getDelta();
        
        // Обновление частиц
        for(let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.mesh.position.add(p.vel);
            p.vel.y -= 0.002;
            p.life -= 0.02;
            if(p.life <= 0) {
                scene.remove(p.mesh);
                particles.splice(i, 1);
            }
        }

        renderer.render(scene, camera);
    }

    init();
</script>
</body>
</html>
